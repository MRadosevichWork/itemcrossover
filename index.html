    let rows = Array(50).fill().map((_, i) => ({
      id: i,
      zSeries: '',
      qty: '',
      result: null
    }));

    function lookupPart(zSeries) {
      const upper = zSeries.toUpperCase().trim();
      return crossoverData[upper] || null;
    }

    function handleInputChange(index, field, value) {
      rows[index][field] = value;
      
      if (field === 'zSeries' && value.trim()) {
        const result = lookupPart(value);
        rows[index].result = result;
      } else if (field === 'zSeries' && !value.trim()) {
        rows[index].result = null;
      }
      
      render();
    }

    function copyResults() {
      const results = rows
        .filter(r => r.result)
        .map(r => `${r.result[0]}\t${r.qty || '1'}`)
        .join('\n');
      
      if (results) {
        const textarea = document.createElement('textarea');
        textarea.value = results;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        alert('Results copied to clipboard!');
      } else {
        alert('No results to copy');
      }
    }

      const app = document.getElementById('app');
      
      const visibleRows = rows.filter((row, index) => {
        return index === 0 || rows[index - 1].zSeries.trim() !== '';
      });

      app.innerHTML = `

                      ${row.result ? `

                </button>
              ` : ''}
            </div>
          </div>
        </div>
      `;
    }

    // Make functions globally accessible
    window.handleInputChange = handleInputChange;
    window.copyResults = copyResults;

    // Initial render
    render();
  </script>
</body>
</html>
